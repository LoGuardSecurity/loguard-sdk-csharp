name: AI contract regression
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: ai-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  LOGUARD_API_KEY: ''
  LOGGUARD_API_KEY: ''
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/LoGuard.Tests/LoGuard.Tests.csproj --configuration Release
